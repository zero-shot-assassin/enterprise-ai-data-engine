[project]
name = "enterprise-ai-data-engine"
version = "0.1.0"
description = "Enterprise AI Data Engine"
readme = "README.md"
authors = [
    { name = "Clinton Nyaore", email = "cnyaore@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "minio>=7.2.20",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["services/api"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
